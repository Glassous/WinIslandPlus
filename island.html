<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WinIslandPlus</title>
    <link rel="stylesheet" href="/src/island/island.css" />
  </head>
  <body class="island-body">
    <!--
      整块客户区透明：窗口尺寸固定为「胶囊行 + 间距 + 卡片行」，
      可见形状（每个岛面各自的胶囊 / 卡片）由内部 .actor 元素用
      transform / width / height / border-radius 动画得到，圆角外的像素是真正的逐像素透明，
      点击由 Rust 轮询两块形状判定后穿透到下方窗口。

      两个岛面互不耦合：
        - 媒体岛：胶囊层（封面 + 音柱，或圆形专辑图）与媒体卡片层；
        - dsh 岛：胶囊层（状态点 + 阶段 + 用量）与独立的 dsh 信息卡层。
      同一时刻最多只有一个岛面处于展开（morph = 1）。
    -->
    <div class="stage" id="stage">
      <!-- ---------------- 媒体岛 ---------------- -->
      <div class="actor media-actor" id="mediaActor">
        <!-- 封面取色流光：只属于媒体卡片（光源由 glow.ts 生成，在卡片边缘局部游走） -->
        <div class="glow-layer" id="glowLayer" aria-hidden="true"></div>

        <!-- 胶囊层：只有一个岛时是「左封面 + 右音柱」胶囊；两个岛并存时收成正圆只显示封面 -->
        <div class="pill-layer" id="mediaPillLayer">
          <div class="media-pill" id="mediaPill">
            <div class="pill-cover" id="pillCover" hidden></div>
            <div class="pill-bars" id="pillBars" aria-hidden="true">
              <span class="bar" id="bar1"></span>
              <span class="bar" id="bar2"></span>
              <span class="bar" id="bar3"></span>
              <span class="bar" id="bar4"></span>
            </div>
          </div>
        </div>

        <!-- 卡片层 -->
        <div class="card-layer" id="mediaCardLayer">
          <div class="card" id="mediaCard">
            <div class="card-content">
              <div class="card-row card-row-top">
                <div class="cover" id="coverCard">
                  <div class="cover-placeholder" id="coverPlaceholder">
                    <span class="glyph glyph-cover" aria-hidden="true">&#xE8D6;</span>
                  </div>
                  <div class="cover-image" id="coverImageHost"></div>
                </div>

                <div class="track-info">
                  <div class="title" id="titleText">未知曲目</div>
                  <div class="artist" id="artistText">未知艺术家</div>
                </div>

                <div class="eq-bars" id="eqBars" aria-hidden="true">
                  <span></span><span></span><span></span><span></span>
                </div>
              </div>

              <div class="card-row card-row-progress">
                <div class="time" id="positionText">0:00</div>
                <div class="seekbar" id="seekBar" role="slider" aria-label="播放进度">
                  <div class="seek-track" id="seekTrack"></div>
                  <div class="seek-fill" id="seekFill"></div>
                  <div class="seek-thumb" id="seekThumb"></div>
                </div>
                <div class="time" id="remainingText">-0:00</div>
              </div>

              <div class="card-bottom">
                <div class="card-row card-row-controls">
                  <div class="ctrl" id="prevButton" role="button" aria-label="上一首">
                    <span class="glyph glyph-prev" aria-hidden="true">&#xE892;</span>
                  </div>
                  <div class="ctrl" id="playButton" role="button" aria-label="播放/暂停">
                    <span class="glyph glyph-play" id="playIcon" aria-hidden="true">&#xE768;</span>
                  </div>
                  <div class="ctrl" id="nextButton" role="button" aria-label="下一首">
                    <span class="glyph glyph-next" aria-hidden="true">&#xE893;</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ---------------- DeepSeek Harness 岛 ---------------- -->
      <div class="actor dsh-actor" id="dshActor">
        <div class="pill-layer" id="dshPillLayer">
          <div class="pill-dsh" id="pillDsh">
            <span class="dsh-dot idle" id="pillDshDot" aria-hidden="true"></span>
            <span class="dsh-stage" id="pillDshStage"></span>
            <span class="dsh-metric" id="pillDshTokens"></span>
            <span class="dsh-metric dsh-muted" id="pillDshCost" hidden></span>
            <span class="dsh-metric dsh-balance" id="pillDshBalance" hidden></span>
          </div>
        </div>

        <div class="card-layer" id="dshCardLayer">
          <div class="dsh-card" id="dshCard">
            <div class="dsh-row-head">
              <img class="dsh-logo" src="/src/island/assets/dsh-icon.svg" alt="" aria-hidden="true" />
              <div class="dsh-row-title">
                <span class="dsh-dot idle" id="dshCardDot" aria-hidden="true"></span>
                <span class="dsh-stage" id="dshCardStage"></span>
                <span class="dsh-tool" id="dshCardTool" hidden></span>
              </div>
            </div>
            <div class="dsh-row-body">
              <span class="dsh-metric" id="dshCardTokens"></span>
              <span class="dsh-metric dsh-muted" id="dshCardCost"></span>
              <span class="dsh-metric dsh-balance" id="dshCardBalance"></span>
              <span class="dsh-model" id="dshCardModel" hidden></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/island/main.ts"></script>
  </body>
</html>
